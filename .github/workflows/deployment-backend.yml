name: Deploy Backend

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deployment-backend.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared packages
        run: npm run build -w packages/shared
      - name: Build Backend
        run: npm run build -w backend
      - name: Creating production files
        run: |
          set -Eeuo pipefail

          rm -rf deploy-package

          mkdir -p deploy-package/backend \
            deploy-package/packages/shared

          cp -r backend/dist deploy-package/backend/dist
          cp backend/package.json deploy-package/backend/package.json

          cp -r backend/drizzle.config.ts deploy-package/backend/drizzle.config.ts
          cp -r backend/drizzle/ deploy-package/backend/drizzle/

          cp -r packages/shared/dist deploy-package/packages/shared/dist
          cp packages/shared/package.json \
             deploy-package/packages/shared/package.json

          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json

      - name: Prepare incoming directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            rm -rf "$HOME/app-incoming"
            mkdir -p "$HOME/app-incoming"
      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "deploy-package/"
          target: "/home/${{ secrets.GCP_VM_USER }}/app-incoming"
          strip_components: 1
          overwrite: true
      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail

            APP="$HOME/app"
            INCOMING="$HOME/app-incoming"
            PM2_NAME="resqplate-backend"

            echo "Installing production dependencies..."
            cd "$INCOMING"

            npm ci --omit=dev --ignore-scripts \
                --workspace=backend --workspace=packages/shared --include-workspace-root

            echo "Verifying runtime dependencies..."
            cd "$INCOMING/backend"

            node -e "console.log(import.meta.resolve('better-auth'))"
            node -e "console.log(import.meta.resolve('@resqplate/shared'))"

            echo "Replacing deployed application..."
            rm -rf "$APP"
            mv "$INCOMING" "$APP"

            echo "Loading all secrets from secret Manager..."
              export DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
              export BETTER_AUTH_SECRET=$(gcloud secrets versions access latest --secret=BETTER_AUTH_SECRET)
              export BETTER_AUTH_URL=$(gcloud secrets versions access latest --secret=BETTER_AUTH_URL)
              export FRONTEND_URL=$(gcloud secrets versions access latest --secret=FRONTEND_URL)

              export RESEND_API_KEY=$(gcloud secrets versions access latest --secret=RESEND_API_KEY)
              export GOOGLE_PLACES_API_KEY=$(gcloud secrets versions access latest --secret=GOOGLE_PLACES_API_KEY)
              export ALGOLIA_APP_ID=$(gcloud secrets versions access latest --secret=ALGOLIA_APP_ID)
              export ALGOLIA_WRITE_API_KEY=$(gcloud secrets versions access latest --secret=ALGOLIA_WRITE_API_KEY)
              export ALGOLIA_LISTINGS_INDEX=$(gcloud secrets versions access latest --secret=ALGOLIA_LISTINGS_INDEX)
            echo "Loaded everything"

            echo "Restarting PM2..."
            cd "$APP/backend"
            if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
                pm2 restart resqplate-backend --update-env
            else
                pm2 start dist/server.js --name "$PM2_NAME"
            fi

            pm2 save

            echo "Checking backend health"
            healthy=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent \
                http://127.0.0.1:3000/api/health \
                >/dev/null; then
                echo "Backend deployment succeded."
                healthy=true
                break
              fi
              echo "Health check attempt $attempt failed."
              sleep 5
            done

            if [ "$healthy" != true ]; then
              echo "Backend failed health check"
              pm2 logs "$PM2_NAME" --lines 50 --nostream || true
              exit 1
            fi

            echo "Configuring Algolia index"
            node dist/scripts/config-algolia.js

            echo "Reindexing Algolia"
            node dist/scripts/reindex-algolia.js

            echo "Restarting backend after Algolia setup"
            pm2 restart "$PM2_NAME" --update-env
            pm2 save

            echo "Backend deployment and search indexing completed."
