name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: resqplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate -w backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/resqplate_test
      - run: npm run test --workspaces --if-present
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/resqplate_test
      - run: npm audit --omit=dev --audit-level=high || echo "Error in running npm audit"
